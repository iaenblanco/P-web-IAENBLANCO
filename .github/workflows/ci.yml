name: CI

# Tres jobs en cada corrida: "tipos y guardia" (barato, corre siempre) y, solo
# si ese pasa y solo para codigo de este repo, "visual QA" (build + sanity +
# contrast) y "visual diff" (build + capturas contra la linea base). Y uno
# manual, "linea base visual", que solo corre a pedido.
#
# Para mergear a main se exigen dos: "tipos y guardia" y "visual QA". "visual
# diff" es un piloto: se ve en el pull request, puede fallar y no frena nada.
#
# Job "tipos y guardia": las dos revisiones baratas que Cloudflare NO hace.
# Cloudflare Pages construye desde main con "next build" a secas: no corre tsc
# y no sabe nada de la guardia del CSS. Ese job cubre justo ese hueco, y nada
# mas. No construye el sitio.
#
# Job "visual QA": si construye, porque mide el artefacto que se quiere
# mergear (out/), no produccion. Eso trae la dependencia de red que antes se
# evitaba: next/font baja las tipografias de Google en tiempo de build
# (app/layout.tsx:2). Un rojo en el paso "Construir" puede ser Google y no el
# sitio: se relanza.
#
# Job "visual diff": construye igual y compara las 14 capturas de
# qa/visual.spec.json contra qa/baseline/. Si difieren deja un artifact con el
# informe y las imagenes de las que fallaron. Nunca escribe la linea base.
#
# Job "linea base visual": genera la linea base de capturas del check
# screenshots (qa/baseline/). Es manual: workflow_dispatch con la casilla
# "generar_linea_base" marcada. No escribe en el repo: deja la carpeta como
# artifact, y versionarla es un commit aparte que entra por pull request
# (qa/README.md).
#
# Lo que este workflow NO hace: bloquear el despliegue. El push a main ES el
# despliegue, asi que Actions y el build de Cloudflare arrancan a la vez y el
# visto llega cuando el sitio ya salio. Para que bloquee de verdad hay que
# trabajar por pull request y marcar el job como obligatorio en la proteccion
# de rama: eso es un cambio de habito, no de archivo.
#
# La guardia del CSS vive aca y no dentro de "npm run build" a proposito, como
# dice herramientas/LEEME.md:126-128: un CSS en falta tiene que avisar, no
# tumbar un despliegue.
#
# DIFERIDO -- la bateria nocturna contra out/ (herramientas/verificar.mjs) no
# entra todavia. Tres cosas la traban, con el ancla de cada una:
#   1. herramientas/verificar.mjs:36 fija el binario de Chrome de Windows:
#      const CHROME = 'C:/Program Files/Google/Chrome/Application/chrome.exe'
#      En ubuntu-latest ese spawn no existe. Lo mismo en los otros seis
#      scripts: inventario-mono.mjs:23, medir-trabajos.mjs:51,
#      mirar-diagnostico.mjs:21, mirar-escenas.mjs:30, mirar-motion.mjs:40,
#      og.mjs:33. Haria falta leer la ruta de un CHROME_BIN, con el valor de
#      hoy como reserva para que Windows siga igual.
#   2. herramientas/verificar.mjs:488 termina en process.exit(0) incondicional,
#      que pisa el process.exitCode = 2 de la linea 456. Peor: los doce
#      criterios de la linea 440 no tocan el codigo de salida en ningun lado,
#      asi que aunque se corrija la 488 la bateria seguiria saliendo 0 con
#      cuarenta hallazgos encima. Haria falta que la salida respete CRIT.
#   3. No hay linea base tomada en Linux, y la bateria completa ya murio tres
#      veces seguidas en la maquina propia con causa sin diagnosticar
#      (herramientas/verificar.mjs:16-22). Haria falta correrla a mano una vez
#      en el runner y guardar esa base antes de que una cron pueda fallar.
# Ninguna de las tres se toca desde este archivo: los scripts de herramientas/
# hoy funcionan en Windows y no son de esta tanda.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # El unico camino para generar la linea base de capturas: a mano y con
      # la casilla marcada. Sin marcarla, el dispatch corre lo mismo que un
      # push.
      generar_linea_base:
        description: 'Generar la linea base de capturas (qa/baseline/) y dejarla como artifact. No escribe en el repo.'
        type: boolean
        default: false

# Si entran tres commits seguidos, solo interesa el ultimo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: este workflow no escribe en el repo. Importa porque el repo es
# publico y pull_request lo puede disparar un fork.
#
# Secreto requerido (solo los jobs que traen el motor: "visual QA", "visual
# diff" y "linea base visual"):
#   IAENBLANCO_AGENT_SYSTEM_TOKEN
#   Para que sirve: checkout de solo lectura del motor central de QA, que es
#   un repo privado (IAenBlanco-Oracle/iaenblanco-agent-system).
#   Permiso minimo: Contents: Read, solo sobre ese repo. Nada mas.
# Con el disparador pull_request GitHub no entrega secretos a los PR de forks,
# y ademas esos jobs no corren en ese caso (ver el "if" de cada uno). Nunca
# cambiar el disparador a pull_request_target: correria codigo ajeno con el
# secreto.
permissions:
  contents: read

# El motor central se fija por SHA completo, nunca por rama, y una sola vez
# para todos los jobs que lo usan: asi la linea base de capturas y las
# mediciones de qa/README.md salen del mismo commit del motor. Subirlo es un
# cambio deliberado que va junto con volver a medir.
env:
  MOTOR_REPO: IAenBlanco-Oracle/iaenblanco-agent-system
  MOTOR_SHA: 23c7c13fa0b297960f9fc3439bedb23c238ae1bc
  MOTOR_DIR: .iaenblanco-agent-system
  SALIDA: qa/.salida-ci

jobs:
  revision:
    name: tipos y guardia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 LTS. La maquina de Nico corre v24, pero para tsc y para la
          # guardia da igual. 22 es ademas el piso que pediria la bateria el
          # dia que entre: usa el WebSocket global (verificar.mjs:433).
          node-version: '22'
          cache: 'npm'

      # package-lock.json es lockfileVersion 3 y ya trae los binarios
      # @next/swc-linux-*, asi que esto corre en ubuntu sin tocar nada.
      - name: Instalar dependencias
        run: npm ci

      # Es el paso 2 del flujo que ya esta escrito en DEPLOYMENT.md, hecho
      # automatico. No hace falta construir antes: en un arbol recien clonado
      # (sin next-env.d.ts ni .next/types, los dos gitignoreados) igual pasa.
      - name: Revisar los tipos
        run: npx tsc --noEmit

      # Cuenta las cinco marcas de app/globals.css contra la linea base de
      # herramientas/guardia-css.json, que esta rastreado a proposito: sin el,
      # este paso saldria 2 en un runner limpio. Sale 0 si no hay marca nueva,
      # 1 si la hay, 2 si falta la linea base. No necesita build, ni servidor,
      # ni Chrome, ni una sola dependencia.
      - name: Guardia del CSS
        run: node herramientas/guardia-css.mjs

  # Mide el artefacto del commit: build estatico a out/ y, sobre eso, los dos
  # checks del motor central con qa/visual.spec.json. No compara capturas.
  #
  # En pull_request es la senal previa al merge. En push a main es solo una
  # verificacion posterior: Cloudflare ya empezo a desplegar, esto no lo frena.
  visual-qa:
    name: visual QA
    needs: revision
    # Solo codigo de confianza: push a main, workflow_dispatch, o un PR cuya
    # rama vive en este mismo repo. Un PR de fork queda "skipped": no llega a
    # tocar el secreto ni el motor privado.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Los diez pasos de preparacion llevan un ancla de YAML (&prep-...): los
      # otros jobs que necesitan el build y el motor los repiten por alias
      # (*prep-...) en vez de copiarlos. Se editan aca, una sola vez.
      - &prep-checkout
        uses: actions/checkout@v4

      - &prep-node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - &prep-dependencias
        name: Instalar dependencias
        run: npm ci

      # Antes de traer el motor a proposito: asi tsc y next no ven ningun
      # archivo ajeno dentro del arbol.
      - &prep-construir
        name: Construir
        run: npm run build

      - &prep-out
        name: Confirmar out/
        run: |
          test -f out/index.html
          test -f out/servicios/index.html
          test -f out/contacto/index.html

      # Sin secreto no hay motor, y sin motor no hay veredicto: falla con un
      # mensaje claro en vez de saltarse el QA o usar otra copia del tooling.
      # Solo comprueba que no este vacio; no lo imprime.
      - &prep-secreto
        name: Comprobar el secreto del motor
        env:
          TOKEN: ${{ secrets.IAENBLANCO_AGENT_SYSTEM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=Falta el secreto IAENBLANCO_AGENT_SYSTEM_TOKEN::Este job necesita el secreto de Actions IAENBLANCO_AGENT_SYSTEM_TOKEN (solo lectura, Contents: Read sobre $MOTOR_REPO) para traer el motor central. Crearlo en Settings > Secrets and variables > Actions y relanzar el job."
            exit 1
          fi

      - &prep-motor
        name: Traer el motor central
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MOTOR_REPO }}
          ref: ${{ env.MOTOR_SHA }}
          token: ${{ secrets.IAENBLANCO_AGENT_SYSTEM_TOKEN }}
          path: ${{ env.MOTOR_DIR }}
          persist-credentials: false

      - &prep-motor-sha
        name: Confirmar el SHA del motor
        run: |
          real="$(git -C "$MOTOR_DIR" rev-parse HEAD)"
          echo "motor: $real"
          test "$real" = "$MOTOR_SHA"

      # Playwright en la version exacta del lock del motor. Solo la libreria:
      # el navegador es el Chrome del sistema (la spec pide channel "chrome").
      - &prep-runtime
        name: Instalar el runtime del motor
        working-directory: ${{ env.MOTOR_DIR }}/tools/runtime
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # La imagen del runner trae Google Chrome estable en
      # /opt/google/chrome/chrome, que es donde Playwright busca el channel
      # "chrome". Se usa ese y se deja la version en el log. Si un dia la
      # imagen no lo trae, lo instala el propio Playwright del motor (paquete
      # oficial de Google). La version de Chrome no se puede fijar: es la
      # estable del dia, igual que en la maquina de Nico.
      - &prep-chrome
        name: Chrome
        run: |
          if [ ! -x /opt/google/chrome/chrome ]; then
            echo "::warning::La imagen no trae Google Chrome; se instala con Playwright."
            (cd "$MOTOR_DIR/tools/runtime" && npx playwright install chrome)
          fi
          /opt/google/chrome/chrome --version

      - name: Sanity
        id: sanity
        run: node "$MOTOR_DIR/tools/qa/visual/bin/sanity.mjs" --spec qa/visual.spec.json --out "$SALIDA"

      # Corre aunque sanity incumpla: interesa ver los dos informes juntos.
      - name: Contrast
        if: ${{ !cancelled() && (steps.sanity.outcome == 'success' || steps.sanity.outcome == 'failure') }}
        run: node "$MOTOR_DIR/tools/qa/visual/bin/contrast.mjs" --spec qa/visual.spec.json --out "$SALIDA"

      # Solo los dos JSON y solo si algo fallo. Con codigo 2 (error de entorno)
      # el motor no escribe informe: en ese caso no hay nada que subir.
      - name: Subir los informes si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.sha }}
          path: |
            qa/.salida-ci/sanity.json
            qa/.salida-ci/contrast.json
          if-no-files-found: ignore
          retention-days: 14

  # PILOTO, NO OBLIGATORIO. Compara las capturas del build contra la linea base
  # versionada en qa/baseline/, pixel por pixel.
  #
  # Es un job aparte y no un paso de "visual QA" a proposito: "visual QA" es un
  # check requerido para mergear y este no. Asi un rojo aca se ve en el pull
  # request sin frenar el merge, y "visual QA" sigue diciendo lo mismo que
  # antes. No esta en los checks requeridos de la proteccion de rama, y no hay
  # que agregarlo ahi mientras dure el piloto.
  #
  # Solo compara. Nunca lleva --update-baseline: la linea base cambia a mano,
  # con el job "linea base visual" de mas abajo.
  visual-diff:
    name: visual diff
    needs: revision
    # La misma regla que "visual QA": un PR de fork queda "skipped" y no llega
    # a tocar el secreto ni el motor privado.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # La misma imagen con la que se genero la linea base.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *prep-checkout
      - *prep-node
      - *prep-dependencias
      - *prep-construir
      - *prep-out
      - *prep-secreto
      - *prep-motor
      - *prep-motor-sha
      - *prep-runtime
      - *prep-chrome

      - name: Imagen del runner
        run: echo "imagen ${ImageOS:-desconocida} ${ImageVersion:-desconocida}"

      # Codigo 0: ninguna captura difiere. 1: alguna difiere. 2: no se pudo
      # comparar (falta la linea base, el manifiesto no vale o es de otra
      # plataforma). Con 2 la herramienta no escribe informe, solo consola:
      # por eso la consola tambien se guarda.
      - name: Comparar las capturas
        run: |
          set -o pipefail
          mkdir -p "$SALIDA"
          node "$MOTOR_DIR/tools/qa/visual/bin/screenshots.mjs" --spec qa/visual.spec.json --out "$SALIDA" 2>&1 | tee "$SALIDA/screenshots.log"

      # Solo si fallo. En screenshots/ la herramienta deja tres imagenes por
      # cada captura que difiere (linea base, candidata y diff) y ninguna de
      # las que pasan: el artifact no carga la linea base entera.
      - name: Subir el diff si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.sha }}
          path: |
            qa/.salida-ci/screenshots.json
            qa/.salida-ci/screenshots.log
            qa/.salida-ci/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # Genera la linea base de capturas del check screenshots. Es el UNICO lugar
  # del repo donde aparece --update-baseline, y solo corre a mano:
  # workflow_dispatch con la casilla "generar_linea_base" marcada. En
  # pull_request y en push no puede correr: ahi no hay "inputs" y el "if" da
  # falso.
  #
  # No escribe en el repo (el workflow entero es contents: read) ni abre pull
  # requests: deja qa/baseline/ como artifact. Versionarla es un commit
  # deliberado en una rama, que entra a main por pull request como cualquier
  # cambio. Los pasos estan en qa/README.md.
  linea-base:
    name: linea base visual
    needs: revision
    if: github.event_name == 'workflow_dispatch' && inputs.generar_linea_base
    # Fijo en 24.04 y no "latest": la linea base describe lo que pinta esta
    # imagen con su Chrome. Cambiar de imagen es cambiar de linea base, y eso
    # se hace a proposito.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *prep-checkout
      - *prep-node
      - *prep-dependencias
      - *prep-construir
      - *prep-out
      - *prep-secreto
      - *prep-motor
      - *prep-motor-sha
      - *prep-runtime
      - *prep-chrome

      # La linea base solo guarda la plataforma y la version de Chrome: la
      # imagen del runner queda en el log.
      - name: Imagen del runner
        run: echo "imagen ${ImageOS:-desconocida} ${ImageVersion:-desconocida}"

      # Todo o nada: si una sola captura no es valida (falta una fuente
      # requerida o la pagina no se estabiliza) la herramienta no escribe
      # ninguna y sale 1. Si el arbol ya traia una linea base, la actualiza
      # entera y borra las capturas que la spec ya no mide.
      - name: Generar la linea base
        run: node "$MOTOR_DIR/tools/qa/visual/bin/screenshots.mjs" --spec qa/visual.spec.json --out "$SALIDA/generar" --update-baseline

      # La linea base recien escrita tiene que reproducirse sobre este mismo
      # build: 0 px. Si no, no sirve de referencia y no se sube.
      - name: Comparar contra la linea base recien generada
        run: node "$MOTOR_DIR/tools/qa/visual/bin/screenshots.mjs" --spec qa/visual.spec.json --out "$SALIDA/comparar"

      # La carpeta entera mas los dos informes. La raiz del artifact es qa/:
      # se descomprime ahi y cada cosa cae en su lugar (los informes, en una
      # carpeta ignorada por Git).
      - name: Subir la linea base
        uses: actions/upload-artifact@v4
        with:
          name: linea-base-visual-${{ github.sha }}
          path: |
            qa/baseline/
            qa/.salida-ci/generar/screenshots.json
            qa/.salida-ci/comparar/screenshots.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      # Sin la linea base: no llego a escribirse o no se reprodujo. Los
      # informes y, si la comparacion fallo, las capturas que difieren.
      - name: Subir el diagnostico si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linea-base-visual-fallo-${{ github.sha }}
          path: |
            qa/.salida-ci/generar/screenshots.json
            qa/.salida-ci/comparar/screenshots.json
            qa/.salida-ci/comparar/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
